name: Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/lattice-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/lattice-desktop
        run: npm ci

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Validate Windows updater lifecycle
        shell: pwsh
        run: ./.github/scripts/test-windows-update.ps1

      - name: Build Windows installer
        working-directory: apps/lattice-desktop
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lattice-windows-x64
          path: apps/lattice-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
