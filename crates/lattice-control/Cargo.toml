[package]
name = "lattice-control"
version = "0.1.0"
edition = "2024"

[lib]
name = "lattice_control"
path = "src/lib.rs"

[[bin]]
name = "lattice-control"
path = "src/main.rs"

[[bin]]
name = "lattice-bootstrapper"
path = "src/bin/lattice-bootstrapper.rs"

[[bin]]
name = "lattice-master"
path = "src/bin/lattice-master.rs"

[dependencies]
axum = "0.8"
lattice-crypto = { path = "../lattice-crypto" }
lattice-protocol = { path = "../lattice-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
subtle = "2.6"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
