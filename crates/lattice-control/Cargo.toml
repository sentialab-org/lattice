[package]
name = "lattice-control"
version = "0.3.2"
edition = "2024"

[lib]
name = "lattice_control"
path = "src/lib.rs"

[[bin]]
name = "lattice-control"
path = "src/main.rs"

[[bin]]
name = "lattice-bootstrapper"
path = "src/bin/lattice-bootstrapper.rs"

[[bin]]
name = "lattice-master"
path = "src/bin/lattice-master.rs"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = "0.5"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
url = "2"
rpassword = "7"
axum = "0.8"
lattice-crypto = { path = "../lattice-crypto" }
lattice-protocol = { path = "../lattice-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
subtle = "2.6"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "process", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
